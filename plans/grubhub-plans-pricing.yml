  description: Commission-free branded online ordering site for the restaurant's own traffic.
  source: https://get.grubhub.com/products/grubhub-direct/
notes: >-
  Replaces the 2026-05-04 bulk-sweep artifact, which carried Basic ~15% / Plus ~20-25% /
  Premium ~25-30% and a "Premium" tier name. The live page read 2026-09-17 says Basic 5%,
  Plus 15%, All-access 20%, and the tier is called All-access, not Premium. New York City has
  separate published pricing (the page links to it) because of the municipal fee cap; exact rates
  are still set per restaurant contract and vary by market.
