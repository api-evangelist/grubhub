specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Grubhub
providerId: grubhub
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Food Delivery
  - Marketplaces
  - Restaurants
  - Online Ordering
description: Grubhub's developer APIs (Menu, Orders, Merchant Data, Merchant Schedules, Deliveries,
  Onboarding) are integration APIs for restaurants, POS providers, online ordering providers, and
  delivery aggregators. Access is granted through Grubhub's partner program rather than self-serve
  signup. Grubhub does not publish per-call API prices; revenue flows from marketplace commissions
  and merchant subscription plans negotiated with restaurants. The developer portal renders only
  via JavaScript so the public landing pages return no plan content to automated fetches.
notes: No public per-call API price list. Plan information here reflects the partner-program
  structure inferred from the developer portal taxonomy. Reconcile against a partner contract or
  the live developer portal once accessible.
sources:
  - https://developer.grubhub.com
  - https://www.grubhub.com/restaurant
plans:
  - id: grubhub-partner
    name: Partner Integration (negotiated)
    type: enterprise
    description: Partner / POS / aggregator integration covering Menu, Orders, Deliveries,
      Merchant Data, Schedules, and Onboarding APIs. Access is via Grubhub's partner program
      with technical onboarding and sandbox provisioning.
    entries:
      - label: Integration access
        name: partner_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact partnerships
        userMultiplied: false
    elements:
      - name: Grubhub Menu API
      - name: Grubhub Orders API
      - name: Grubhub Merchant Data API
      - name: Grubhub Merchant Schedules API
      - name: Grubhub Deliveries API
      - name: Grubhub Onboarding API
      - name: Sandbox provisioning
      - name: Partner technical onboarding
  - id: grubhub-merchant-marketplace
    name: Restaurant Marketplace (commission-based)
    type: usage-based
    description: Restaurants on the Grubhub Marketplace pay commission on each order plus
      optional marketing / delivery service fees. The commission rate is set per restaurant
      contract; published Marketplace plans are tiered (e.g. Basic / Plus / Premium) with
      different commission rates and feature bundles. The integration APIs are included with
      the marketplace listing.
    entries:
      - label: Per-order commission
        name: order_commission
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contact restaurant sales
        userMultiplied: false
    elements:
      - name: Grubhub Marketplace listing
      - name: Order routing through Grubhub Orders API
      - name: Optional Grubhub Connect delivery
maintainers:
