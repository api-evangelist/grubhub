specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Grubhub
providerId: grubhub
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-06-02'
reconciled: true
tags:
  - Food Delivery
  - Marketplaces
  - Restaurants
  - Online Ordering
description: >-
  Grubhub's developer APIs (Menu, Orders, Merchant Data, Merchant Schedules, Deliveries,
  Onboarding) are integration APIs accessed through Grubhub's partner program rather than self-serve
  signup; they carry no published per-call API price. Grubhub's revenue is commission-based -
  restaurants on the Grubhub Marketplace pay a per-order commission whose rate depends on the
  Marketplace plan they choose (Basic / Plus / Premium), plus a payment-processing fee and optional
  add-ons such as Sponsored Listings. The integration APIs are included with a Marketplace listing.
  Commission percentages below are the publicly advertised ranges; the exact rate is set per
  restaurant contract and varies by market.
notes: Marketplace commission tiers (Basic ~15%, Plus ~20-25%, Premium/All-Access ~25-30%), the ~3.05%
  + $0.30 payment-processing fee, and the +5% Sponsored Listing add-on are reconciled against Grubhub's
  public restaurant pricing pages. Exact rates are negotiated per restaurant and per market; the API
  partner-integration plan itself has no published price (contact partnerships).
sources:
  - https://get.grubhub.com/faq/what-fees-does-grubhub-charge-restaurants/
  - https://get.grubhub.com/blog/grubhub-prices-guide/
  - https://developer.grubhub.com
  - https://www.grubhub.com/restaurant
plans:
  - id: grubhub-partner
    name: Partner Integration (negotiated)
    type: enterprise
    description: Partner / POS / aggregator integration covering Menu, Orders, Deliveries,
      Merchant Data, Schedules, and Onboarding APIs. Access is via Grubhub's partner program
      with technical onboarding and sandbox provisioning. No published per-call API price.
    entries:
      - label: Integration access
        name: partner_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact partnerships
        userMultiplied: false
    elements:
      - name: Grubhub Menu API
      - name: Grubhub Orders API
      - name: Grubhub Merchant Data API
      - name: Grubhub Merchant Schedules API
      - name: Grubhub Deliveries API
      - name: Grubhub Onboarding API
      - name: Sandbox provisioning
      - name: Partner technical onboarding
  - id: grubhub-marketplace-basic
    name: Marketplace Basic
    type: usage-based
    description: Marketplace listing for restaurants that fulfill delivery with their own drivers.
      Lowest commission tier; the restaurant handles its own logistics. Integration APIs included.
    entries:
      - label: Per-order commission (Basic)
        name: marketplace_commission_basic
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '~15%'
        userMultiplied: false
      - label: Payment processing fee
        name: payment_processing
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '3.05% + $0.30'
        userMultiplied: false
    elements:
      - name: Grubhub Marketplace listing
      - name: Order routing through Grubhub Orders API
      - name: Self-delivery (restaurant-owned drivers)
  - id: grubhub-marketplace-plus
    name: Marketplace Plus
    type: usage-based
    description: Marketplace listing that unlocks Grubhub's driver network so Grubhub handles
      delivery, at a higher per-order commission than Basic. Integration APIs included.
    entries:
      - label: Per-order commission (Plus)
        name: marketplace_commission_plus
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '~20-25%'
        userMultiplied: false
      - label: Payment processing fee
        name: payment_processing
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '3.05% + $0.30'
        userMultiplied: false
    elements:
      - name: Grubhub Marketplace listing
      - name: Grubhub driver network delivery (Grubhub Connect)
      - name: Order routing through Grubhub Orders API
      - name: Delivery tracking through Grubhub Deliveries API
  - id: grubhub-marketplace-premium
    name: Marketplace Premium / All-Access
    type: usage-based
    description: Highest Marketplace tier bundling Grubhub-network delivery with additional
      marketing and promotion tools. Highest per-order commission. Integration APIs included.
    entries:
      - label: Per-order commission (Premium / All-Access)
        name: marketplace_commission_premium
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '~25-30%'
        userMultiplied: false
      - label: Payment processing fee
        name: payment_processing
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '3.05% + $0.30'
        userMultiplied: false
      - label: Sponsored Listing (optional add-on)
        name: sponsored_listing
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '+5%'
        userMultiplied: false
    elements:
      - name: Grubhub Marketplace listing
      - name: Grubhub driver network delivery (Grubhub Connect)
      - name: Marketing and promotion tools
      - name: Optional Sponsored Listing placement
      - name: Order routing through Grubhub Orders API
