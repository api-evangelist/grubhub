    during onboarding. Grubhub publishes no price, no rate card and no self-serve signup for this.
  contact: https://developer.grubhub.com/get-started
  source: https://developer.grubhub.com/
add_ons:
- id: grubhub-delivery
  name: Grubhub Delivery
  price_from: 10
  unit: percent
  billing_period: per-order
  description: >-
    Use Grubhub's courier fleet instead of your own. Delivery fees start at 10%. Self Delivery is
    0% (you use your own drivers); Supplemental Delivery charges the same fee from 10% only on the
    orders Grubhub's fleet actually carries. This is the commercial side of the Grubhub Connect
    (DaaS) API in openapi/grubhub-connect-endpoints-openapi.yml.
  source: https://get.grubhub.com/grubhub-pricing-and-fees/
- id: grubhub-direct
  name: Grubhub Direct
  price: 0
