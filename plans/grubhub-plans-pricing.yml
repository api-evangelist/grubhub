description: >-
  Grubhub publishes no price for API access. The partner APIs (Menu, Orders, Merchant Data, Merchant
  Schedules, Deliveries, Grubhub Connect, Onboarding, Reporting) are included with a Grubhub
  Marketplace listing and are reached through the partner program - there is no self-serve API
  signup, no metered per-call price and no API plan page. What Grubhub does publish is the
  MERCHANT pricing that the APIs serve: three Marketplace marketing-commission tiers plus a
  delivery fee. Those are recorded below verbatim from the live pricing page, read 2026-09-17.
plan_count: 4
api_pricing_published: false
billing_unit: percent-of-order
plans:
