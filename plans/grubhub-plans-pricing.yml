  name: Basic
  type: commission
  price: 5
  currency: USD
  unit: percent
  billing_period: per-order
  description: '5% marketing commission. Attract a new, food-loving audience.'
  included:
  - No platform or maintenance fees
  - Standard customer delivery fee
  - Placement on Grubhub and Seamless apps
  - Marketplace ordering link
  - Access to account support
  - Free professional menu photoshoot
  source: https://get.grubhub.com/grubhub-pricing-and-fees/
- id: plus
  name: Plus
  type: commission
