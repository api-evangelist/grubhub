specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Grubhub
providerId: grubhub
publisherName: Grubhub Holdings Inc.
serviceCategory: Food Delivery / Marketplaces
created: '2026-05-04'
modified: '2026-06-02'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Food Delivery
  - Marketplaces
  - Restaurants
description: 'FOCUS-aligned FinOps for Grubhub: a tiered per-order take rate (Marketplace Basic
  ~15%, Plus ~20-25%, Premium/All-Access ~25-30%) plus a ~3.05% + $0.30 payment-processing fee and
  optional add-ons (e.g. +5% Sponsored Listings), not per-API-call billing. The partner integration
  APIs (Menu, Orders, Deliveries, Merchant Data, Schedules, Onboarding) are included with the
  merchant Marketplace agreement and carry no separate API charge.'
notes: Cost flows through restaurant-Marketplace commissions (tiered take rate), payment processing,
  and optional service fees rather than a per-call API price book. Commission tiers and processing
  fee reconciled against Grubhub's public restaurant pricing pages; exact per-restaurant rates are
  contract- and market-specific.
sources:
  - https://get.grubhub.com/faq/what-fees-does-grubhub-charge-restaurants/
  - https://get.grubhub.com/blog/grubhub-prices-guide/
  - https://developer.grubhub.com
  - https://www.grubhub.com/restaurant
billingModel:
  pricingCategory: Tiered Take Rate + Processing Fee
  billingFrequency: Continuous Settlement
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Grubhub
  ServiceCategory: Food Delivery / Marketplaces
  ProviderName: Grubhub
  PublisherName: Grubhub Holdings Inc.
  InvoiceIssuerName: Grubhub Holdings Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: marketplace_orders
    description: Orders routed through the Grubhub Marketplace
    unit: order
    aggregation: sum
    dimensions:
      - restaurant
      - market
      - order_type
  - name: marketplace_gmv
    description: Gross merchandise value of marketplace orders
    unit: USD
    aggregation: sum
    dimensions:
      - restaurant
      - market
  - name: connect_deliveries
    description: Deliveries fulfilled by the Grubhub courier network (Grubhub Connect)
    unit: delivery
    aggregation: sum
    dimensions:
      - restaurant
      - market
  - name: payment_processing_fees
    description: Per-transaction payment-processing charge (~3.05% + $0.30) applied to orders
    unit: USD
    aggregation: sum
    dimensions:
      - restaurant
      - market
  - name: api_requests
    description: Partner integration API calls (operational metric, not directly billed)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - partner
      - restaurant
  - name: webhook_events
    description: Outbound order / delivery / merchant webhook events
    unit: event
    aggregation: sum
    dimensions:
      - event_type
      - restaurant
principles:
  - name: Visibility
    description: Use the Grubhub merchant portal / payouts reporting and partner dashboards to
      reconcile commission, delivery, and refund line items per restaurant.
  - name: Allocation
    description: Tag restaurants / locations with brand / region / franchisee so commission and
      Connect-delivery costs allocate to the correct P&L.
  - name: Optimization
    description: Negotiate commission rates at scale; tune which markets use Connect vs
      restaurant-fulfilled delivery; use the Schedules API to avoid orders during overload.
  - name: Accountability
    description: Designate a partnerships / merchant-ops owner accountable for the Grubhub
      contract, monthly payout reconciliation, and dispute / refund handling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
