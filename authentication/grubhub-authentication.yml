gaps:
- No securitySchemes block in any published OpenAPI document, so no operation carries a machine-readable
  security requirement; a client cannot tell from the contract which credential an operation needs.
- No /.well-known/openid-configuration and no jwks_uri published on any host probed.
- No /.well-known/oauth-protected-resource, so the resource-server side of RFC 9728 is undiscoverable.
- The prose auth guide lives on developer.grubhub.com, which renders client-side from Contentful and
  is not machine-readable.
