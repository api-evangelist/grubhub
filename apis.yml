name: Grubhub
aid: grubhub
description: 'Grubhub is a US online food-ordering and delivery marketplace connecting diners with local restaurants
  across Grubhub and Seamless. Its partner platform lets point-of-sale vendors, online-ordering providers, delivery
  aggregators and enterprise restaurant brands integrate directly: ingest normalized menus, receive and fulfil Marketplace
  orders, control merchant availability and schedules, run last-mile delivery on Grubhub''s national courier network
  through Grubhub Connect, onboard merchants self-service, and export merchant reports. Grubhub publishes twelve
  first-party OpenAPI documents covering 91 operations and three egress webhooks from its partner developer portal.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/grubhub.png
url: https://raw.githubusercontent.com/api-evangelist/grubhub/refs/heads/main/apis.yml
