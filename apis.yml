  name: Grubhub Menu API
  description: 'Create, update and manage Grubhub Marketplace menus. Ingestion is diff-based against external IDs:
    validate a normalized menu, submit it, poll the ingestion job, and read back what Grubhub stored. Also carries
    menu-item schedule overrides (by internal or external ID, in bulk) and alcohol tagging.'
