naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Orders API — Order Change Requests"
  description: >-
    Orders — Order Change Requests. 1 operation(s). Lead operation: Get Order Change Requests.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Orders
    - Order Change Requests
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "orders-order-change-requests"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Orders API — Order Change Requests business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-long-id-orders-order-uuid-changerequests"
          path: "/pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/changerequests"
          operations:
            - name: "getOrderChangeRequests"
              method: GET
              description: "Get Order Change Requests"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "order_uuid"
                  in: path
                  type: string
                  required: true
                  description: "The UUID of the order."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "orders-order-change-requests-rest"
      port: 8080
      description: "REST adapter for Grubhub Orders API — Order Change Requests. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-long-id}/orders/{order-uuid}/changerequests"
          name: "merchant-merchant-long-id-orders-order-uuid-changerequests"
          description: "REST surface for Order Change Requests."
          operations:
            - method: GET
              name: "getOrderChangeRequests"
              description: "Get Order Change Requests"
              call: "orders-order-change-requests.getOrderChangeRequests"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "order_uuid": "rest.order_uuid"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "orders-order-change-requests-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Orders API — Order Change Requests. One tool per consumed operation."
      tools:
        - name: "get-order-change-requests"
          description: "Get Order Change Requests"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-order-change-requests.getOrderChangeRequests"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "order_uuid": "tools.order_uuid"
          outputParameters:
            - type: object
              mapping: "$."
