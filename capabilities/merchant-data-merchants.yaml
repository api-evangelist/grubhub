naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Merchant Data API — Merchants"
  description: >-
    Merchant Data — Merchants. 2 operation(s). Lead operation: List Partner Merchants.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Merchant Data
    - Merchants
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "merchant-data-merchants"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Merchant Data API — Merchants business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchants"
          path: "/pos/v1/merchants"
          operations:
            - name: "listMerchants"
              method: GET
              description: "List Partner Merchants"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-id"
          path: "/pos/v1/merchant/{merchant_id}"
          operations:
            - name: "getMerchant"
              method: GET
              description: "Get Merchant Summary"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "merchant-data-merchants-rest"
      port: 8080
      description: "REST adapter for Grubhub Merchant Data API — Merchants. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchants"
          name: "merchants"
          description: "REST surface for Merchants."
          operations:
            - method: GET
              name: "listMerchants"
              description: "List Partner Merchants"
              call: "merchant-data-merchants.listMerchants"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-id}"
          name: "merchant-merchant-id"
          description: "REST surface for Merchants."
          operations:
            - method: GET
              name: "getMerchant"
              description: "Get Merchant Summary"
              call: "merchant-data-merchants.getMerchant"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "merchant-data-merchants-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Merchant Data API — Merchants. One tool per consumed operation."
      tools:
        - name: "list-partner-merchants"
          description: "List Partner Merchants"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-data-merchants.listMerchants"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-merchant-summary"
          description: "Get Merchant Summary"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-data-merchants.getMerchant"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
