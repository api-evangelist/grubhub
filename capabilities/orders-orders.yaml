naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Orders API — Orders"
  description: >-
    Orders — Orders. 2 operation(s). Lead operation: Get a Single Order.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Orders
    - Orders
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "orders-orders"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Orders API — Orders business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-long-id-orders-order-uuid"
          path: "/pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}"
          operations:
            - name: "getOrder"
              method: GET
              description: "Get a Single Order"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "order_uuid"
                  in: path
                  type: string
                  required: true
                  description: "The UUID of the order."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-long-id-orders"
          path: "/pos/v1/merchant/{merchant_long_id}/orders"
          operations:
            - name: "listMerchantOrders"
              method: GET
              description: "List Orders for a Merchant"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "status"
                  in: query
                  type: string
                  required: false
                  description: "Filter orders by their current status."
                - name: "start_date"
                  in: query
                  type: string
                  required: false
                  description: "Start of the date range filter in ISO 8601 format."
                - name: "end_date"
                  in: query
                  type: string
                  required: false
                  description: "End of the date range filter in ISO 8601 format."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "orders-orders-rest"
      port: 8080
      description: "REST adapter for Grubhub Orders API — Orders. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-long-id}/orders/{order-uuid}"
          name: "merchant-merchant-long-id-orders-order-uuid"
          description: "REST surface for Orders."
          operations:
            - method: GET
              name: "getOrder"
              description: "Get a Single Order"
              call: "orders-orders.getOrder"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "order_uuid": "rest.order_uuid"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-long-id}/orders"
          name: "merchant-merchant-long-id-orders"
          description: "REST surface for Orders."
          operations:
            - method: GET
              name: "listMerchantOrders"
              description: "List Orders for a Merchant"
              call: "orders-orders.listMerchantOrders"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "status": "rest.status"
                "start_date": "rest.start_date"
                "end_date": "rest.end_date"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "orders-orders-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Orders API — Orders. One tool per consumed operation."
      tools:
        - name: "get-single-order"
          description: "Get a Single Order"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-orders.getOrder"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "order_uuid": "tools.order_uuid"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "list-orders-merchant"
          description: "List Orders for a Merchant"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-orders.listMerchantOrders"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "status": "tools.status"
            "start_date": "tools.start_date"
            "end_date": "tools.end_date"
          outputParameters:
            - type: object
              mapping: "$."
