naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Deliveries API — Delivery Status"
  description: >-
    Deliveries — Delivery Status. 1 operation(s). Lead operation: Get Delivery Status for an Order.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Deliveries
    - Delivery Status
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "deliveries-delivery-status"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Deliveries API — Delivery Status business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-long-id-orders-order-uuid-delivery"
          path: "/pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/delivery"
          operations:
            - name: "getDeliveryStatus"
              method: GET
              description: "Get Delivery Status for an Order"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "order_uuid"
                  in: path
                  type: string
                  required: true
                  description: "The UUID of the order."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "deliveries-delivery-status-rest"
      port: 8080
      description: "REST adapter for Grubhub Deliveries API — Delivery Status. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-long-id}/orders/{order-uuid}/delivery"
          name: "merchant-merchant-long-id-orders-order-uuid-delivery"
          description: "REST surface for Delivery Status."
          operations:
            - method: GET
              name: "getDeliveryStatus"
              description: "Get Delivery Status for an Order"
              call: "deliveries-delivery-status.getDeliveryStatus"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "order_uuid": "rest.order_uuid"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "deliveries-delivery-status-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Deliveries API — Delivery Status. One tool per consumed operation."
      tools:
        - name: "get-delivery-status-order"
          description: "Get Delivery Status for an Order"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "deliveries-delivery-status.getDeliveryStatus"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "order_uuid": "tools.order_uuid"
          outputParameters:
            - type: object
              mapping: "$."
