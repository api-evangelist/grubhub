naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Menu API — Menu Schedule Overrides"
  description: >-
    Menu — Menu Schedule Overrides. 2 operation(s). Lead operation: Update Menu Schedule Overrides.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Menu
    - Menu Schedule Overrides
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "menu-menu-schedule-overrides"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Menu API — Menu Schedule Overrides business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-id-menu-schedules-overrides-external"
          path: "/pos/v1/merchant/{merchant_id}/menu/schedules/overrides/external"
          operations:
            - name: "updateMenuScheduleOverrides"
              method: PUT
              description: "Update Menu Schedule Overrides"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-id-menu-schedules-overrides-job-id-status"
          path: "/pos/v1/merchant/{merchant_id}/menu/schedules/overrides/{job_id}/status"
          operations:
            - name: "getMenuScheduleOverrideStatus"
              method: GET
              description: "Get Menu Schedule Override Job Status"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
                - name: "job_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the ingestion or override job."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "menu-menu-schedule-overrides-rest"
      port: 8080
      description: "REST adapter for Grubhub Menu API — Menu Schedule Overrides. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-id}/menu/schedules/overrides/external"
          name: "merchant-merchant-id-menu-schedules-overrides-external"
          description: "REST surface for Menu Schedule Overrides."
          operations:
            - method: PUT
              name: "updateMenuScheduleOverrides"
              description: "Update Menu Schedule Overrides"
              call: "menu-menu-schedule-overrides.updateMenuScheduleOverrides"
              with:
                "merchant_id": "rest.merchant_id"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-id}/menu/schedules/overrides/{job-id}/status"
          name: "merchant-merchant-id-menu-schedules-overrides-job-id-status"
          description: "REST surface for Menu Schedule Overrides."
          operations:
            - method: GET
              name: "getMenuScheduleOverrideStatus"
              description: "Get Menu Schedule Override Job Status"
              call: "menu-menu-schedule-overrides.getMenuScheduleOverrideStatus"
              with:
                "merchant_id": "rest.merchant_id"
                "job_id": "rest.job_id"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "menu-menu-schedule-overrides-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Menu API — Menu Schedule Overrides. One tool per consumed operation."
      tools:
        - name: "update-menu-schedule-overrides"
          description: "Update Menu Schedule Overrides"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "menu-menu-schedule-overrides.updateMenuScheduleOverrides"
          with:
            "merchant_id": "tools.merchant_id"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-menu-schedule-override-job"
          description: "Get Menu Schedule Override Job Status"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "menu-menu-schedule-overrides.getMenuScheduleOverrideStatus"
          with:
            "merchant_id": "tools.merchant_id"
            "job_id": "tools.job_id"
          outputParameters:
            - type: object
              mapping: "$."
