naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Onboarding API — Issue Reporting"
  description: >-
    Onboarding — Issue Reporting. 1 operation(s). Lead operation: Report an Onboarding Issue.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Onboarding
    - Issue Reporting
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_OAUTH_TOKEN: GRUBHUB_OAUTH_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "onboarding-issue-reporting"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Onboarding API — Issue Reporting business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.GRUBHUB_OAUTH_TOKEN}}"
      resources:
        - name: "onboarding-issue"
          path: "/pos/v1/onboarding/issue"
          operations:
            - name: "reportOnboardingIssue"
              method: POST
              description: "Report an Onboarding Issue"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "onboarding-issue-reporting-rest"
      port: 8080
      description: "REST adapter for Grubhub Onboarding API — Issue Reporting. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/onboarding/issue"
          name: "onboarding-issue"
          description: "REST surface for Issue Reporting."
          operations:
            - method: POST
              name: "reportOnboardingIssue"
              description: "Report an Onboarding Issue"
              call: "onboarding-issue-reporting.reportOnboardingIssue"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "onboarding-issue-reporting-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Onboarding API — Issue Reporting. One tool per consumed operation."
      tools:
        - name: "report-onboarding-issue"
          description: "Report an Onboarding Issue"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-issue-reporting.reportOnboardingIssue"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
