naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Menu API — Menu Retrieval"
  description: >-
    Menu — Menu Retrieval. 1 operation(s). Lead operation: Retrieve Current Merchant Menu.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Menu
    - Menu Retrieval
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "menu-menu-retrieval"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Menu API — Menu Retrieval business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-id-ingestion-menu"
          path: "/pos/v1/merchant/{merchant_id}/ingestion/menu"
          operations:
            - name: "getMerchantMenu"
              method: GET
              description: "Retrieve Current Merchant Menu"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "menu-menu-retrieval-rest"
      port: 8080
      description: "REST adapter for Grubhub Menu API — Menu Retrieval. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-id}/ingestion/menu"
          name: "merchant-merchant-id-ingestion-menu"
          description: "REST surface for Menu Retrieval."
          operations:
            - method: GET
              name: "getMerchantMenu"
              description: "Retrieve Current Merchant Menu"
              call: "menu-menu-retrieval.getMerchantMenu"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "menu-menu-retrieval-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Menu API — Menu Retrieval. One tool per consumed operation."
      tools:
        - name: "retrieve-current-merchant-menu"
          description: "Retrieve Current Merchant Menu"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "menu-menu-retrieval.getMerchantMenu"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
