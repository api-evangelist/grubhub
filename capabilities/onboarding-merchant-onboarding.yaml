naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Onboarding API — Merchant Onboarding"
  description: >-
    Onboarding — Merchant Onboarding. 5 operation(s). Lead operation: Create a New Merchant Referral.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Onboarding
    - Merchant Onboarding
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_OAUTH_TOKEN: GRUBHUB_OAUTH_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "onboarding-merchant-onboarding"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Onboarding API — Merchant Onboarding business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.GRUBHUB_OAUTH_TOKEN}}"
      resources:
        - name: "onboarding-referral"
          path: "/pos/v1/onboarding/referral"
          operations:
            - name: "createMerchantReferral"
              method: POST
              description: "Create a New Merchant Referral"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "onboarding-activate"
          path: "/pos/v1/onboarding/activate"
          operations:
            - name: "activateMerchant"
              method: POST
              description: "Activate a Merchant"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "onboarding-deactivate"
          path: "/pos/v1/onboarding/deactivate"
          operations:
            - name: "deactivateMerchant"
              method: POST
              description: "Deactivate a Merchant"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "onboarding-deactivate-partner"
          path: "/pos/v1/onboarding/deactivate/partner"
          operations:
            - name: "deactivateMerchantPartner"
              method: POST
              description: "Deactivate a Merchant (partner Auth)"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "onboarding-associate"
          path: "/pos/v1/onboarding/associate"
          operations:
            - name: "associateMerchants"
              method: POST
              description: "Associate Merchants with Partner"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "onboarding-merchant-onboarding-rest"
      port: 8080
      description: "REST adapter for Grubhub Onboarding API — Merchant Onboarding. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/onboarding/referral"
          name: "onboarding-referral"
          description: "REST surface for Merchant Onboarding."
          operations:
            - method: POST
              name: "createMerchantReferral"
              description: "Create a New Merchant Referral"
              call: "onboarding-merchant-onboarding.createMerchantReferral"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/onboarding/activate"
          name: "onboarding-activate"
          description: "REST surface for Merchant Onboarding."
          operations:
            - method: POST
              name: "activateMerchant"
              description: "Activate a Merchant"
              call: "onboarding-merchant-onboarding.activateMerchant"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/onboarding/deactivate"
          name: "onboarding-deactivate"
          description: "REST surface for Merchant Onboarding."
          operations:
            - method: POST
              name: "deactivateMerchant"
              description: "Deactivate a Merchant"
              call: "onboarding-merchant-onboarding.deactivateMerchant"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/onboarding/deactivate/partner"
          name: "onboarding-deactivate-partner"
          description: "REST surface for Merchant Onboarding."
          operations:
            - method: POST
              name: "deactivateMerchantPartner"
              description: "Deactivate a Merchant (partner Auth)"
              call: "onboarding-merchant-onboarding.deactivateMerchantPartner"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/onboarding/associate"
          name: "onboarding-associate"
          description: "REST surface for Merchant Onboarding."
          operations:
            - method: POST
              name: "associateMerchants"
              description: "Associate Merchants with Partner"
              call: "onboarding-merchant-onboarding.associateMerchants"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "onboarding-merchant-onboarding-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Onboarding API — Merchant Onboarding. One tool per consumed operation."
      tools:
        - name: "create-new-merchant-referral"
          description: "Create a New Merchant Referral"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-merchant-onboarding.createMerchantReferral"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "activate-merchant"
          description: "Activate a Merchant"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-merchant-onboarding.activateMerchant"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "deactivate-merchant"
          description: "Deactivate a Merchant"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-merchant-onboarding.deactivateMerchant"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "deactivate-merchant-partner-auth"
          description: "Deactivate a Merchant (partner Auth)"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-merchant-onboarding.deactivateMerchantPartner"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "associate-merchants-partner"
          description: "Associate Merchants with Partner"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "onboarding-merchant-onboarding.associateMerchants"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
