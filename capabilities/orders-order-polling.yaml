naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Orders API — Order Polling"
  description: >-
    Orders — Order Polling. 1 operation(s). Lead operation: Poll Orders Across Merchants.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Orders
    - Order Polling
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "orders-order-polling"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Orders API — Order Polling business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "orders-poll"
          path: "/pos/v1/orders/poll"
          operations:
            - name: "pollOrders"
              method: GET
              description: "Poll Orders Across Merchants"
              inputParameters:
                - name: "status"
                  in: query
                  type: string
                  required: false
                  description: "Filter orders by their current status."
                - name: "start_date"
                  in: query
                  type: string
                  required: false
                  description: "Start of the date range filter in ISO 8601 format."
                - name: "end_date"
                  in: query
                  type: string
                  required: false
                  description: "End of the date range filter in ISO 8601 format."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "orders-order-polling-rest"
      port: 8080
      description: "REST adapter for Grubhub Orders API — Order Polling. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/orders/poll"
          name: "orders-poll"
          description: "REST surface for Order Polling."
          operations:
            - method: GET
              name: "pollOrders"
              description: "Poll Orders Across Merchants"
              call: "orders-order-polling.pollOrders"
              with:
                "status": "rest.status"
                "start_date": "rest.start_date"
                "end_date": "rest.end_date"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "orders-order-polling-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Orders API — Order Polling. One tool per consumed operation."
      tools:
        - name: "poll-orders-across-merchants"
          description: "Poll Orders Across Merchants"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-order-polling.pollOrders"
          with:
            "status": "tools.status"
            "start_date": "tools.start_date"
            "end_date": "tools.end_date"
          outputParameters:
            - type: object
              mapping: "$."
