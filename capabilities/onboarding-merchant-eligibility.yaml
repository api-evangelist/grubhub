naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Onboarding API — Merchant Eligibility"
  description: >-
    Onboarding — Merchant Eligibility. 1 operation(s). Lead operation: Get Merchant Eligibility.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Onboarding
    - Merchant Eligibility
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_OAUTH_TOKEN: GRUBHUB_OAUTH_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "onboarding-merchant-eligibility"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Onboarding API — Merchant Eligibility business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.GRUBHUB_OAUTH_TOKEN}}"
      resources:
        - name: "onboarding-eligibility-merchant-id"
          path: "/pos/v1/onboarding/eligibility/{merchant_id}"
          operations:
            - name: "getMerchantEligibility"
              method: GET
              description: "Get Merchant Eligibility"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The identifier of the merchant to check eligibility for."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "onboarding-merchant-eligibility-rest"
      port: 8080
      description: "REST adapter for Grubhub Onboarding API — Merchant Eligibility. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/onboarding/eligibility/{merchant-id}"
          name: "onboarding-eligibility-merchant-id"
          description: "REST surface for Merchant Eligibility."
          operations:
            - method: GET
              name: "getMerchantEligibility"
              description: "Get Merchant Eligibility"
              call: "onboarding-merchant-eligibility.getMerchantEligibility"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "onboarding-merchant-eligibility-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Onboarding API — Merchant Eligibility. One tool per consumed operation."
      tools:
        - name: "get-merchant-eligibility"
          description: "Get Merchant Eligibility"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "onboarding-merchant-eligibility.getMerchantEligibility"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
