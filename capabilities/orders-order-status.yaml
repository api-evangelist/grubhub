naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Orders API — Order Status"
  description: >-
    Orders — Order Status. 2 operation(s). Lead operation: Confirm an Order.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Orders
    - Order Status
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "orders-order-status"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Orders API — Order Status business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-long-id-orders-order-uuid-confirm"
          path: "/pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/confirm"
          operations:
            - name: "confirmOrder"
              method: POST
              description: "Confirm an Order"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "order_uuid"
                  in: path
                  type: string
                  required: true
                  description: "The UUID of the order."
                - name: "body"
                  in: body
                  type: object
                  required: false
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-long-id-orders-order-uuid-status"
          path: "/pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/status"
          operations:
            - name: "updateOrderStatus"
              method: PUT
              description: "Update Order Status"
              inputParameters:
                - name: "merchant_long_id"
                  in: path
                  type: string
                  required: true
                  description: "The long-form unique identifier for the merchant on Grubhub."
                - name: "order_uuid"
                  in: path
                  type: string
                  required: true
                  description: "The UUID of the order."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "orders-order-status-rest"
      port: 8080
      description: "REST adapter for Grubhub Orders API — Order Status. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-long-id}/orders/{order-uuid}/confirm"
          name: "merchant-merchant-long-id-orders-order-uuid-confirm"
          description: "REST surface for Order Status."
          operations:
            - method: POST
              name: "confirmOrder"
              description: "Confirm an Order"
              call: "orders-order-status.confirmOrder"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "order_uuid": "rest.order_uuid"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-long-id}/orders/{order-uuid}/status"
          name: "merchant-merchant-long-id-orders-order-uuid-status"
          description: "REST surface for Order Status."
          operations:
            - method: PUT
              name: "updateOrderStatus"
              description: "Update Order Status"
              call: "orders-order-status.updateOrderStatus"
              with:
                "merchant_long_id": "rest.merchant_long_id"
                "order_uuid": "rest.order_uuid"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "orders-order-status-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Orders API — Order Status. One tool per consumed operation."
      tools:
        - name: "confirm-order"
          description: "Confirm an Order"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "orders-order-status.confirmOrder"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "order_uuid": "tools.order_uuid"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-order-status"
          description: "Update Order Status"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "orders-order-status.updateOrderStatus"
          with:
            "merchant_long_id": "tools.merchant_long_id"
            "order_uuid": "tools.order_uuid"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
