naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Merchant Data API — Merchant Status"
  description: >-
    Merchant Data — Merchant Status. 2 operation(s). Lead operation: Update Merchant Online/offline Status.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Merchant Data
    - Merchant Status
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "merchant-data-merchant-status"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Merchant Data API — Merchant Status business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchants-status"
          path: "/pos/v1/merchants/status"
          operations:
            - name: "updateMerchantStatus"
              method: PUT
              description: "Update Merchant Online/offline Status"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchants-status-batch-id"
          path: "/pos/v1/merchants/status/{batch_id}"
          operations:
            - name: "getMerchantStatusBatch"
              method: GET
              description: "Get Merchant Status Batch Progress"
              inputParameters:
                - name: "batch_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for a batch operation."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "merchant-data-merchant-status-rest"
      port: 8080
      description: "REST adapter for Grubhub Merchant Data API — Merchant Status. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchants/status"
          name: "merchants-status"
          description: "REST surface for Merchant Status."
          operations:
            - method: PUT
              name: "updateMerchantStatus"
              description: "Update Merchant Online/offline Status"
              call: "merchant-data-merchant-status.updateMerchantStatus"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchants/status/{batch-id}"
          name: "merchants-status-batch-id"
          description: "REST surface for Merchant Status."
          operations:
            - method: GET
              name: "getMerchantStatusBatch"
              description: "Get Merchant Status Batch Progress"
              call: "merchant-data-merchant-status.getMerchantStatusBatch"
              with:
                "batch_id": "rest.batch_id"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "merchant-data-merchant-status-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Merchant Data API — Merchant Status. One tool per consumed operation."
      tools:
        - name: "update-merchant-online-offline-status"
          description: "Update Merchant Online/offline Status"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "merchant-data-merchant-status.updateMerchantStatus"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-merchant-status-batch-progress"
          description: "Get Merchant Status Batch Progress"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-data-merchant-status.getMerchantStatusBatch"
          with:
            "batch_id": "tools.batch_id"
          outputParameters:
            - type: object
              mapping: "$."
