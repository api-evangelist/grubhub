naftiko: "1.0.0-alpha2"

info:
  label: "Grubhub Merchant Schedules API — Schedules"
  description: >-
    Merchant Schedules — Schedules. 6 operation(s). Lead operation: Get Delivery Schedule.
    Self-contained Naftiko capability covering one Grubhub business surface.
  tags:
    - Grubhub
    - Merchant Schedules
    - Schedules
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GRUBHUB_API_TOKEN: GRUBHUB_API_TOKEN

capability:

  # Consumes — upstream Grubhub HTTP API
  consumes:
    - type: http
      namespace: "merchant-schedules-schedules"
      baseUri: "https://api-third-party-gtm.grubhub.com"
      description: "Grubhub Merchant Schedules API — Schedules business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: Authorization
        value: "{{env.GRUBHUB_API_TOKEN}}"
        placement: header
      resources:
        - name: "merchant-merchant-id-schedules-delivery"
          path: "/pos/v1/merchant/{merchant_id}/schedules/delivery"
          operations:
            - name: "getDeliverySchedule"
              method: GET
              description: "Get Delivery Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "updateDeliverySchedule"
              method: PUT
              description: "Update Delivery Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-id-schedules-pickup"
          path: "/pos/v1/merchant/{merchant_id}/schedules/pickup"
          operations:
            - name: "getPickupSchedule"
              method: GET
              description: "Get Pickup Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "updatePickupSchedule"
              method: PUT
              description: "Update Pickup Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "merchant-merchant-id-schedules-catering"
          path: "/pos/v1/merchant/{merchant_id}/schedules/catering"
          operations:
            - name: "getCateringSchedule"
              method: GET
              description: "Get Catering Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "updateCateringSchedule"
              method: PUT
              description: "Update Catering Schedule"
              inputParameters:
                - name: "merchant_id"
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier for the merchant on Grubhub."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # REST exposer (required default)
  exposes:
    - type: rest
      namespace: "merchant-schedules-schedules-rest"
      port: 8080
      description: "REST adapter for Grubhub Merchant Schedules API — Schedules. One Spectral-compliant resource per consumed operation."
      resources:
        - path: "/v1/merchant/{merchant-id}/schedules/delivery"
          name: "merchant-merchant-id-schedules-delivery"
          description: "REST surface for Schedules."
          operations:
            - method: GET
              name: "getDeliverySchedule"
              description: "Get Delivery Schedule"
              call: "merchant-schedules-schedules.getDeliverySchedule"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: "updateDeliverySchedule"
              description: "Update Delivery Schedule"
              call: "merchant-schedules-schedules.updateDeliverySchedule"
              with:
                "merchant_id": "rest.merchant_id"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-id}/schedules/pickup"
          name: "merchant-merchant-id-schedules-pickup"
          description: "REST surface for Schedules."
          operations:
            - method: GET
              name: "getPickupSchedule"
              description: "Get Pickup Schedule"
              call: "merchant-schedules-schedules.getPickupSchedule"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: "updatePickupSchedule"
              description: "Update Pickup Schedule"
              call: "merchant-schedules-schedules.updatePickupSchedule"
              with:
                "merchant_id": "rest.merchant_id"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/merchant/{merchant-id}/schedules/catering"
          name: "merchant-merchant-id-schedules-catering"
          description: "REST surface for Schedules."
          operations:
            - method: GET
              name: "getCateringSchedule"
              description: "Get Catering Schedule"
              call: "merchant-schedules-schedules.getCateringSchedule"
              with:
                "merchant_id": "rest.merchant_id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: "updateCateringSchedule"
              description: "Update Catering Schedule"
              call: "merchant-schedules-schedules.updateCateringSchedule"
              with:
                "merchant_id": "rest.merchant_id"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

  # MCP exposer (required default)
    - type: mcp
      namespace: "merchant-schedules-schedules-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Grubhub Merchant Schedules API — Schedules. One tool per consumed operation."
      tools:
        - name: "get-delivery-schedule"
          description: "Get Delivery Schedule"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.getDeliverySchedule"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-delivery-schedule"
          description: "Update Delivery Schedule"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.updateDeliverySchedule"
          with:
            "merchant_id": "tools.merchant_id"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-pickup-schedule"
          description: "Get Pickup Schedule"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.getPickupSchedule"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-pickup-schedule"
          description: "Update Pickup Schedule"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.updatePickupSchedule"
          with:
            "merchant_id": "tools.merchant_id"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-catering-schedule"
          description: "Get Catering Schedule"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.getCateringSchedule"
          with:
            "merchant_id": "tools.merchant_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-catering-schedule"
          description: "Update Catering Schedule"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "merchant-schedules-schedules.updateCateringSchedule"
          with:
            "merchant_id": "tools.merchant_id"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
