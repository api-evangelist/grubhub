  personas:
  - id: pos-partner
    name: POS Integration Partner
    description: Point-of-sale or online-ordering provider integrating merchant menus, orders, and schedules with Grubhub.
    workflows:
    - Menu
    - Orders
    - Merchant Data
    - Merchant Schedules
    - Onboarding
  - id: marketplace-operator
    name: Marketplace Operator
    description: Operator managing merchant lifecycle, availability, and delivery logistics across the Grubhub Marketplace.
    workflows:
    - Merchant Data
    - Merchant Schedules
    - Deliveries
  - id: delivery-aggregator
    name: Delivery Aggregator
    description: Aggregator or enterprise merchant fulfilling orders through Grubhub's courier network via Grubhub Connect.
    workflows:
    - Deliveries
    - Orders
