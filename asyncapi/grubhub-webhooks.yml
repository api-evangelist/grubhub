    Partners cannot set or change the webhook URL themselves. Grubhub configures it during partner
    onboarding, and manual verification is required.
  authentication:
  - Basic authentication with a username and password chosen at partner signup
  - HMAC signature in the Authorization header (Grubhub's recommended option)
  note: The authentication options are documented in prose on the developer portal, not in the contract.
