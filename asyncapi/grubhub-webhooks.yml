note: >-
  Grubhub ships two of its twelve OpenAPI documents as webhooks-only 3.1.0 documents with zero
  callable paths. That is a genuine machine-readable event contract, and it is how the delivery and
  reporting events are recorded here. The Marketplace order webhook - the single most important
  event on the platform, because that is how new orders arrive - has no machine-readable contract.
delivery:
