description: Grubhub rate-limits its Partner Integration API endpoints to minimize abuse, protect backend
  systems, and maintain service quality. Per the official FAQs & Best Practices documentation, endpoint
  limits vary by endpoint but typically range between 200 and 400 requests per minute from a single source.
  Requests above the threshold receive an HTTP 429 response. Limits are enforced per source / OAuth client
  and assigned per partner integration. Grubhub recommends batching entity operations and subscribing
  to webhooks rather than polling to avoid hitting the limit.
notes: Numeric limits (200-400 req/min per single source) confirmed from Grubhub's public FAQs & Best
  Practices documentation. Exact per-endpoint values vary and are assigned per partner integration; reconcile
  a precise per-endpoint table against a partner contract when available.
