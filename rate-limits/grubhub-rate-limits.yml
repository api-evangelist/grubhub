specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Grubhub
providerId: grubhub
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Food Delivery
  - Marketplaces
  - Restaurants
description: Grubhub does not publish numeric rate-limit values for the partner / merchant APIs on
  its public developer portal landing pages (the portal is JavaScript-rendered and not directly
  fetchable). Limits are presumed to be assigned per partner integration during onboarding and
  enforced per OAuth client. Treat the entries below as placeholders pending direct documentation
  from Grubhub.
notes: No public rate-limit numbers found via automated fetch; developer.grubhub.com requires
  client-side JS to render. Reconcile once direct partner-portal access is available.
sources:
  - https://developer.grubhub.com
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Partner integration APIs
    scope: oauth-client
    metric: varies
    limit: 'see partner integration documentation'
    notes: Limits are assigned per OAuth client at partner onboarding; numeric values are not
      published publicly.
  - name: Webhook delivery (Orders, Deliveries)
    scope: partner-endpoint
    metric: varies
    limit: 'partner endpoint must accept burst order volumes'
    notes: Grubhub posts events to the partner's webhook URL; partner is expected to absorb peak
      restaurant order volume rather than rate-limit.
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429 / 503 responses; honor Retry-After
      when present.
  - name: Webhook reliability
    description: Partners receiving Orders / Deliveries webhooks should respond quickly (2xx)
      and process asynchronously to avoid Grubhub-side retry storms.
  - name: Per-integration scoping
    description: Limits scoped per partner OAuth client; new integrations should pre-provision
      headroom with Grubhub before launch.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
