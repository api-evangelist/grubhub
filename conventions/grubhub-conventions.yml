  format: uuid
  oauth: >-
    A real RFC 8414 authorization server exists for the diner-facing surface (scopes openid, diner)
    with dynamic client registration and PKCE. No OpenAPI operation declares a security requirement.
  see: authentication/grubhub-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  retention: null
  evidence: >-
    No Idempotency-Key header, no idempotency_key body field, no client-supplied request identifier
    and no replay-protection language appears anywhere in the twelve documents, across 56 mutating
    operations - 12 of which are POST creates (delivery quotes, refunds, proxy phone numbers, schedule
    overrides, merchant referrals, test orders).
  consequence: >-
    An agent that retries a failed POST /delivery/daas/v1/{deliveryId}/refund or
    POST /pos/v1/merchant/{merchant_id}/schedules/overrides has no way to know whether the first
    attempt landed. The 409 on POST schedules/overrides ("Schedule override overlaps existing
    override") is the closest thing to replay protection in the contract, and it is a side effect
    of overlap validation, not a deduplication guarantee.
reversibility:
  grade: documented
  note: >-
    Real reversal operations exist across the write surface and are named in the contract. NO window
    is stated anywhere in the twelve documents or on any machine-readable page, so this grades as
    documented (0.4) rather than verified (1.0). Do NOT read a window into these - none is published.
  surfaces:
  - write: POST /delivery/daas/v1/quote/{quoteId}/accept (acceptDeliveryQuote)
    reversal: POST /delivery/daas/v1/{deliveryId}/cancel (cancelDelivery)
    window: unstated
    note: >-
      The contract says a delivery quote can expire (400 "Delivery quote expired") but does not
      state the quote's validity period or how late a delivery may be cancelled.
  - write: any completed Grubhub Connect delivery
    reversal: POST /delivery/daas/v1/{deliveryId}/refund (requestRefund)
    window: unstated
    note: Returns 202 - the refund is accepted asynchronously and reported back on the Delivery Refund Update webhook.
  - write: POST /pos/v1/merchant/{merchant_id}/busy (setBusyMode)
    reversal: DELETE /pos/v1/merchant/{merchant_id}/busy (deleteActiveBusyMode)
    window: unstated
  - write: POST /pos/v1/merchant/{merchant_id}/schedules/overrides (overrideSchedule)
    reversal: DELETE /pos/v1/merchant/{merchant_id}/schedules/overrides (deleteScheduleOverride)
    window: unstated
  - write: POST /pos/v1/merchant/{merchant_id}/schedules/closenow (closeNow)
    reversal: POST /pos/v1/merchant/{merchant_id}/schedules/opennow (openNow)
    window: unstated
  - write: POST /merchant/onboarding/v1/activate (activateMerchants)
    reversal: POST /merchant/onboarding/v1/deactivate (deactivate)
    window: unstated
  - write: POST /merchant/onboarding/v1/partner/activate (partnerActivateMerchants)
    reversal: POST /merchant/onboarding/v1/partner/deactivate (partnerDeactivate)
    window: unstated
  irreversible:
  - PUT /pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/status - no operation reverts an
    order status transition once applied.
  - POST /pos/v1/menu/ingestion - menu ingestion is diff-based against external IDs; there is no
    rollback operation and no menu version to restore.
  - POST /delivery/daas/v1/{deliveryId}/tip (updateCourierTip) - increase only, no decrease or void.
dry_run_mode:
  supported: true
  mechanisms:
