    operation: POST /delivery/daas/v1/quote (requestDeliveryQuote)
    description: >-
      Boolean header, default false. Marks the request as a test so the resulting delivery can only be
      progressed by the test endpoints. Works in production as well as preproduction, and the resulting
      delivery cannot be progressed in production.
  - name: menu validation
    operation: POST /pos/v1/menu/ingestion/validate (validatePosMenu)
    description: Validates a normalized menu without ingesting it.
  see: sandbox/grubhub-sandbox.yml
