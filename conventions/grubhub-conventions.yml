identifier_hazard:
  note: >-
    The single largest integration hazard in this contract. Two different merchant identifier
    spaces are used and the ONLY signal of which one an operation wants is the path-parameter name -
    merchant_id (legacy) versus merchant_long_id (long form). Both are declared as plain strings
    with no format, no pattern and no description. GET /pos/v1/merchant/{merchant_long_id}/orders
    and GET /pos/v1/merchant/{merchant_id}/busy sit in the same API and take different identifiers.
