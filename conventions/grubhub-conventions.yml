  response_fields: none declared
batching:
  supported: true
  note: >-
    A distinct and unusual convention: several merchant-wide writes are submitted as a batch and
    return a batch_id, then polled for completion at a matching /{batch_id}/status operation.
  pattern:
  - submit: PUT /pos/v1/merchant/properties
    poll: GET /pos/v1/merchant/properties/{batch_id}/status
  - submit: PUT /pos/v1/merchant/pos-status
    poll: GET /pos/v1/merchant/pos-status/{batch_id}/status
  - submit: PUT /pos/v2/merchant/pos-status
    poll: GET /pos/v2/merchant/pos-status/{batch_id}/status
  - submit: PUT /pos/v1/merchant/integrationlive
    poll: GET /pos/v1/merchant/integrationlive/{batch_id}/status
  - submit: POST /pos/v1/menu/ingestion
    poll: GET /pos/v1/menu/ingestion/jobs/{job_id}
  - submit: PATCH /pos/v1/merchant/{merchant_id}/menu/schedules/overrides
    poll: GET /pos/v1/merchant/{merchant_id}/menu/schedules/overrides/{job_id}/status
  - submit: PATCH /pos/v1/merchant/{merchant_id}/menu/entities/tags/alcohol
    poll: GET /pos/v1/merchant/{merchant_id}/menu/entities/tags/{job_id}/status
  failure_mode: >-
    422 when the batch contains duplicate merchant IDs, exceeds the maximum size, is empty, or
    contains a merchant blocked from updates. The maximum batch size is never published.
