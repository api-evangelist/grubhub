  /pos/v1/merchant/{merchant_id}/menu/entities/tags/{job_id}/status:
    get:
      tags:
      - Endpoints
      summary: Check supplemental tag job status
      description: Checks the status of the specified supplemental tag job.
      operationId: getBulkSupplementalTagStatus
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      - name: job_id
        in: path
        description: The unique supplemental tag job identifier.
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job status was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosBulkSupplementalTagStatus'
        '404':
          description: Job does not exist.
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/menu/ingestion/jobs/{job_id}:
    get:
      tags:
      - Endpoints
      summary: Check ingestion job status
      description: Checks the status of the specified menu ingestion job.
      operationId: getMenuIngestionStatus
      parameters:
      - name: X-GH-PARTNER-KEY
        in: header
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        description: The identifier of the menu ingestion job to check.
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosNormalizedMenuUpdateStatus'
              example:
                job_id: 35b5b71c-417c-448f-8390-5eea50b59ca5
                details: Successful ingestion
                merchant_statuses:
