  /pos/v1/menu/ingestion/validate:
    post:
      tags:
      - Endpoints
      summary: Validate a normalized menu
      description: Verifies that the menu provided as the request body is a valid and complete PosNormalizedMenu data object. You do not need to validate a menu object before you run the ingestion process, but validation can save you the hassle of having a menu ingestion process fail unexpectedly.
      operationId: validatePosMenu
      parameters:
      - name: is_normalized_menu
        in: query
        description: Is the menu in a normalized format.
        required: true
        explode: true
        schema:
          type: boolean
          default: false
      - name: merchant_id
        in: query
        description: The Grubhub or third-party provided external ID for the merchant. Corresponds to a single location.
        required: false
        explode: true
        schema:
          type: string
      responses:
        '503':
          description: The menu validation has timed out.
        '200':
          description: Successfully or unsuccessfully performed a validation check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosNormalizedMenuValidationResult'
              example:
                valid: true
                validation_errors: []
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/menu/ingestion:
    post:
      tags:
      - Endpoints
      summary: Add or update a normalized menu
      description: 'Uploads a complete menu to Grubhub, including schedules, sections, items, and modifiers. Because of the size of the data used in this operation, the processing portion of this job completes after this endpoint responds. To find out the status of a normalized menu ingestion, call GET /pos/v1/menu/ingestion/jobs/{job_id}. Use the job_id returned from this endpoint.


        By default, this endpoint expects the menu to conform to the normalized menu structure. To indicate this reference structure, the required field normalized_menu=true must be in the request body.


        All objects within this menu payload must have external_id values attached to them for this upload to complete. External IDs that match existing objects will be merged with that object''s data. If a field exists in both the existing and ingested data, the ingested data will replace it. If the data only exists in the new data, then that object will be created. If the data exists in the old menu but not the new one, then that object will be deleted.


        External IDs must be unique across all menu entities of the same type, except for menu schedules and sections, which must be globally unique.


        Grubhub has a retry mechanism when attempting to download a partner menu. Upon failure, nine retry attempts over a span of five minutes are made before failing the job completely.


        You can call GET /pos/v1/merchant/{merchant_id}/ingestion/menu to retrieve the current menu, then edit that object and use this endpoint to replace the existing menu with the edited one.


        This call supports GZIP compression. In the request header, pass Accept-Encoding: gzip to receive a compressed response payload. Whether you send the JSON object compressed or not, it must be encoded in UTF-8.


        We recommend that you use this endpoint for all menu creation, edits, and deletions.'
      operationId: addOrUpdatePosFullMenu
      parameters:
      - name: X-GH-PARTNER-KEY
        in: header
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      requestBody:
        description: The request payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosNormalizedMenuUpdateRequest'
            example:
              merchant_ids:
              - store182
              menu_url: https://example.com/menu
              normalized_menu: true
              apply_existing_schedule_overrides: false
        required: true
      responses:
        '409':
          description: Merchant(s) already has an active async update process.
        '422':
          description: Syntax of the request content was correct, but unable to process the contained instructions.
        '200':
          description: Menu successfully enqueued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosNormalizedMenuUpdateResult'
              example:
                job_id: b78fba98-fb76-4748-9c72-dba110afa923
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_id}/menu/schedules/overrides/external:
    patch:
      tags:
      - Endpoints
      summary: Bulk menu item schedule override operation by external IDs
      description: Bulk add or update the menu schedule overrides by external ID. Used to '86' a list of entities (items / modifiers).
      operationId: bulkAddOrUpdateSchedulesOverridesByExternalIds
      parameters:
      - name: merchant_id
        in: path
        description: The Grubhub or third-party provided external ID for the merchant.
        required: true
        explode: false
        schema:
          type: string
      - name: allow_partial_success
        in: query
        description: Should valid overrides still be applied if there are individual failures on the bulk operation
        required: true
        explode: true
        schema:
          type: boolean
          default: false
      requestBody:
        description: A list of PosScheduleOverrideBulkRequests, each containing a list of Partner external entity IDs and the schedule override operation to be applied for all of them.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PosScheduleOverrideBulkRequest'
            example:
            - entity_ids:
              - entity_id1
              - entity_id2
              schedule_override:
                op: ADD
                start: '2023-07-20T12:00:00.000Z'
                end: '9999-12-31T23:59:00.000Z'
                show_or_hide: SHOW
            - entity_ids:
              - entity_id3
              - entity_id4
              schedule_override:
                op: UPDATE
                cur_end_date: '2023-07-20T12:00:00.000Z'
                start: '2023-07-20T12:00:00.000Z'
                end: '2023-12-31T23:59:00.000Z'
                show_or_hide: HIDE
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosScheduleOverrideMultiOperationResult'
              example:
                status: QUEUED
                message: Menu entity schedule override operation is queued.
                entity_ids:
                - entity_id_1
                - entity_id_2
                job_id: b3332f8b-64c6-4a46-89c2-3c27c27e8edf
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_id}/menu/schedules/overrides:
    get:
      tags:
      - Endpoints
      summary: Get schedule overrides for a merchant
      description: Returns the schedule overrides for a given merchant, optionally you can pass dates to use as a range.
      operationId: getSchedulesOverridesForMerchant
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      - name: ending_after
        in: query
        description: A start date to use for the search window. If "now" is provided then current datetime will be used.
        required: true
        explode: true
        schema:
          type: string
      - name: ending_before
        in: query
        description: An end date to use for the search window. If "endOfTime" is provided then December 31, 9999, 23:59 (11:59 PM) UTC will be used
        required: true
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Schedule overrides were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosScheduleOverrides'
              example:
                merchant_id: merchant_id_123
                item_overrides:
                - merchant_id: merchant_id_123
                  item_id: item_id_1
                  external_id: external_item_id_1
                  intervals:
                  - start: '2023-07-18T12:00:00Z'
                    end: '2023-07-18T15:00:00Z'
                    show_or_hide: SHOW
                  - start: '2023-07-19T10:00:00Z'
                    end: '2023-07-19T13:00:00Z'
                    show_or_hide: HIDE
                - merchant_id: merchant_id_123
                  item_id: item_id_2
                  external_id: external_item_id_2
                  intervals:
                  - start: '2023-07-18T14:00:00Z'
                    end: '2023-07-18T17:00:00Z'
                    show_or_hide: HIDE
                modifier_overrides:
                - merchant_id: merchant_id_123
                  modifier_id: modifier_id_1
                  external_id: external_modifier_id_1
