  /pos/v1/merchant/{merchant_long_id}/test/transmission:
    post:
      tags:
      - Endpoints
      summary: Create transmission test
      description: A transmission test order is a simple order that flows through the entire Grubhub order processing system. This is typically the last step in a go-live process for a new merchant.These orders will contain a the lowest-priced menu item not requiring modifiers found on the menu for the given merchant. All line items in this order will be sent with zero cost, so that no actual charges will accrue. Test orders only exist within the POS ecosystem; they will not show up in the Grubhub for Restaurants app or on any accounting sheet.
      operationId: postTestOrderRequest
      parameters:
      - name: merchant_long_id
        in: path
        description: The The Grubhub or third-party provided external ID for the merchant.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Specifies whether the transmission test should be for delivery and/or catering. Note - catering not currently supported.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosTestOrderRequest'
            example:
              is_delivery: false
              is_catering: true
              is_validation: true
        required: true
      responses:
        '200':
          description: Successfully created the transmission test order. Returns the UUID of the resulting order.
          content:
            application/json:
              schema:
                type: string
                format: uuid
              example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_long_id}/test/jitevent:
    post:
      tags:
      - Endpoints
      summary: Create order with JIT flag triggered
      description: Generates a test order event in order to make sure that your functionality that triggers JIT event functions properly. The order will contain information from the referenced order but will not affect that order or create real-life delivery events. To configure a JIT event webhook for your POS integration, contact your Grubhub account representative.
      operationId: simulateJitOrderEvent
      parameters:
      - name: merchant_long_id
        in: path
        description: The The Grubhub or third-party provided external ID for the merchant.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: JIT Test Order Information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitTestOrder'
            example:
              order_id: 93101167-9065-4b9c-b98b-5d789a3ed9fe
              order_merchant_id: 3fd56ebd-323b-4791-8e69-e96cc7445d16
              order_number: '9876543210'
              order_status: CONFIRMED
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: uuid
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_long_id}/test/delivery:
    post:
      tags:
      - Endpoints
      summary: Create test delivery
      description: Generates a test delivery event in order to make sure that your delivery status webhook functions properly. The delivery will contain information from the referenced order but will not affect that order or create real-life delivery events.To configure a delivery webhook for your POS integration, contact your Grubhub account representative.
      operationId: postTestDeliveryRequest
      parameters:
      - name: merchant_long_id
        in: path
        description: Long Grubhub Id for the merchant
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The Order Id and delivery status to create test delivery event is generated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryTestRequest'
            example:
              order_id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
              status: DELIVERED
        required: true
      responses:
        '409':
          description: Unable to send delivery - merchant does not have webhooks enabled
        '200':
          description: Successfully created test delivery
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
components:
  schemas:
    PosBusyInterval:
      type: object
      properties:
        busy_interval_id:
          type: string
          description: Unique identifier of the busy interval.
          format: uuid
        start_time:
          type: string
          description: When the busy interval begins, as an RFC-3339 / ISO-8601 UTC timestamp.
          format: date-time
        end_time:
          type: string
          description: When the busy interval ends, as an RFC-3339 / ISO-8601 UTC timestamp.
          format: date-time
        eta_increase_seconds:
          type: integer
          description: Additional time, in seconds, added to the displayed delivery ETA while the restaurant is busy.
          format: int64
        remaining_seconds:
          type: integer
          description: Seconds remaining until the busy interval ends (end_time).
          format: int64
      description: Details of the active busy interval, or null when the restaurant is not busy.
    PosGetBusyModeResponse:
      type: object
      properties:
        busy:
          type: boolean
          description: Whether the restaurant currently has an active busy interval.
        busy_interval:
          $ref: '#/components/schemas/PosBusyInterval'
    PosBusyModeResponse:
      type: object
      properties:
        restaurant_id:
          type: string
          description: The short Grubhub ID for the merchant the busy interval applies to.
        busy_interval_id:
          type: string
          description: Unique identifier of the created busy interval.
          format: uuid
        eta_increase_seconds:
          type: integer
          description: Additional time, in seconds, added to the displayed delivery ETA while the restaurant is busy.
          format: int64
        start_time:
          type: string
          description: When the busy interval begins, as an RFC-3339 / ISO-8601 UTC timestamp.
          format: date-time
        end_time:
          type: string
          description: When the busy interval ends, as an RFC-3339 / ISO-8601 UTC timestamp.
          format: date-time
    PosBusyModeRequest:
      type: object
      properties:
        eta_increase_seconds:
          type: integer
          description: Additional time, in seconds, to add to the displayed delivery ETA while the restaurant is busy. Must be non-negative; defaults to 0 if omitted.
          format: int64
        start_time:
          type: string
          description: When the busy interval begins, as an RFC-3339 / ISO-8601 UTC timestamp.
          format: date-time
        end_time:
          type: string
          description: When the busy interval ends, as an RFC-3339 / ISO-8601 UTC timestamp. Must be after start_time.
          format: date-time
