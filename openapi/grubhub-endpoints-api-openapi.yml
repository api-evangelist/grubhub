openapi: 3.2.0
info:
  title: Grubhub Endpoints API
  version: '1.0'
  description: 'Operations tagged Endpoints across 8 of this provider''s published API definitions: grubhub-busy-intervals-openapi.yml, grubhub-deliveries-openapi.yml, grubhub-menu-openapi.yml, grubhub-merchant-data-openapi.yml, grubhub-merchant-schedules-openapi.yml, grubhub-onboarding-openapi.yml, grubhub-orders-openapi.yml, grubhub-testing-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-third-party-gtm-pp.grubhub.com
  description: preprod
- url: https://api-third-party-gtm.grubhub.com
  description: prod
tags:
- name: Endpoints
paths:
  /pos/v1/merchant/{merchant_id}/busy/{busy_interval_id}:
    put:
      tags:
      - Endpoints
      summary: Update an active busy interval
      description: Updates the ETA increase or end time on an existing busy interval for the restaurant.
      operationId: updateBusyMode
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      - name: busy_interval_id
        in: path
        description: The unique identifier of the busy interval to update.
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      requestBody:
        description: Updated busy interval parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosBusyModeRequest'
            example:
              eta_increase_seconds: 600
              start_time: '2026-05-25T18:00:00Z'
              end_time: '2026-05-25T19:00:00Z'
        required: true
      responses:
        '422':
          description: The request body is missing required fields or is otherwise invalid.
        '200':
          description: Busy interval successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosBusyModeResponse'
              example:
                restaurant_id: store182
                busy_interval_id: b4a16ee1-0a4f-4f3b-8b86-9f7c9b9a2d6a
                eta_increase_seconds: 600
                start_time: '2026-05-25T18:00:00Z'
                end_time: '2026-05-25T19:00:00Z'
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_id}/busy:
    get:
      tags:
      - Endpoints
      summary: Get the current busy interval
      description: Returns whether the restaurant is currently busy and details about the active busy interval.
      operationId: getBusyMode
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Current busy interval, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosGetBusyModeResponse'
              example:
                busy: true
                busy_interval:
                  busy_interval_id: b4a16ee1-0a4f-4f3b-8b86-9f7c9b9a2d6a
                  start_time: '2026-05-25T18:00:00Z'
                  end_time: '2026-05-25T19:00:00Z'
                  eta_increase_seconds: 600
                  remaining_seconds: 1200
    post:
      tags:
      - Endpoints
      summary: Mark restaurant as busy
      description: Marks the restaurant as busy for the time window specified in the request, increasing the displayed ETA for diners.
      operationId: setBusyMode
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      requestBody:
        description: Busy interval parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosBusyModeRequest'
            example:
              eta_increase_seconds: 600
              start_time: '2026-05-25T18:00:00Z'
              end_time: '2026-05-25T19:00:00Z'
        required: true
      responses:
        '422':
          description: The request body is missing required fields or is otherwise invalid.
        '200':
          description: Busy interval successfully set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosBusyModeResponse'
              example:
                restaurant_id: store182
                busy_interval_id: b4a16ee1-0a4f-4f3b-8b86-9f7c9b9a2d6a
                eta_increase_seconds: 600
                start_time: '2026-05-25T18:00:00Z'
                end_time: '2026-05-25T19:00:00Z'
    delete:
      tags:
      - Endpoints
      summary: Clear the active busy interval
      description: Ends the currently active busy interval for the restaurant, if any.
      operationId: deleteActiveBusyMode
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: Busy interval cleared, or there was no active interval to clear.
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
  /pos/v1/merchant/{merchant_long_id}/orders/{order_uuid}/delivery:
    get:
      tags:
      - Endpoints
      summary: Get delivery by order ID
      description: Retrieve the current state of a Delivery for an Order.
      operationId: getExternalDeliveryByOrderUuid
      parameters:
      - name: merchant_long_id
        in: path
        description: The Grubhub long ID for the merchant. Corresponds to a single location.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: order_uuid
        in: path
        description: The unique ID for the Order whose Delivery information is being requested.
        required: true
        style: simple
        explode: false
        schema:
