          type: string
      description: 'The type of substitution: ADDED, REMOVED, QUANTITY_CHANGED, QUANTITY_WEIGHT_CHANGED, SUBITEMS_CHANGED, REPLACED'
      discriminator:
        propertyName: type
        mapping:
