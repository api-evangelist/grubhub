          description: OrderServiceType-specific configurations for this menu item. All keys should be strings representing order-service types (valid options include "STANDARD_DELIVERY", "STANDARD_PICKUP", "CATERING_DELIVERY", and "GROUP_DELIVERY". All values should be of type NormalizedItemFulfillmentTypeSettings.
