        availability_ranges:
          type: array
          description: A list of `external_id` values for `PosNormalizedAvailabilityRanges` objects that indicate the date ranges when this menu item will be available for ordering.
          items:
            type: string
            description: A list of `external_id` values for `PosNormalizedAvailabilityRanges` objects that indicate the date ranges when this menu item will be available for ordering.
        allowable_order_types:
          uniqueItems: true
          type: array
          description: The set of order types that can use this item. If the value is null or empty, the item will default to being "STANDARD"
          items:
            type: string
            enum:
            - STANDARD
            - CATERING
            - GROUP
        availability_override:
          type: string
          description: The `external_id` value for `availability_overrides` object that indicate the date ranges when this menu item will not be available for ordering.
        gtin:
          type: string
          description: The Global Trade Number Identification Number (GTIN) is for manufactured items only. This is assigned by the manufacturer (barcode on the back of the product packaging) to uniquely identify your item and used by Grubhub to optimize your menu.<br /><br />In North America, use the 12 digit UPC number (unless the product is a book in which case you'd use the ISBN). The complete list of GTIN number types is as follows:<br /><br />    UPC (in North America / GTIN-12) - 12-digit number<br />    EAN (in Europe / GTIN-13) - 13-digit number<br />    JAN (in Japan / GTIN-13) - 8 or 13-digit number<br />    ISBN (for books) - 13-digit number (convert ISBN-10 to ISBN-13). If you have both, include only the 13-digit number.<br />    ITF-14 (for multipacks / GTIN-14) - 14-digit number<br /><br />Only provide a GTIN if you are sure it is correct, other wise leave it blank. An incorrect GTIN can cause menu ingestion to fail.
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        weight_in_pounds:
          type: number
          description: The weight of the item in pounds.
          format: float
        location_in_store:
          type: string
          description: The location of the item in the store.
        serving_size:
          type: integer
          description: The number of expected servings for each quantity of this item.
          format: int32
        measured_price:
          $ref: '#/components/schemas/MeasuredPrice'
        fulfillment_type_settings:
          type: object
          additionalProperties:
