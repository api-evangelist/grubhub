  /merchant/onboarding/v1/merchants:
    get:
      tags:
      - Endpoints
      summary: Get Merchant Eligibility
      description: Returns the list of merchants under the Grubhub user and their eligibility status for onboarding to the partner. Optionally accepts a list of merchantIds as a query parameter to filter results to a specific subset. Optionally accepts page and size query parameters; when either is supplied, results are sorted in ascending merchant ID order, the response contains only the requested page, and pagination metadata is returned in the X-Total-Count, X-Page, X-Page-Size and X-Total-Pages response headers. An RFC 8288 Link response header provides first, prev, next and last page URLs; follow the next relation until it is absent to walk all pages. Requesting a page beyond X-Total-Pages returns 200 with an empty list. Without page and size the full list is returned as before.
      operationId: getEligibleMerchants
      parameters:
      - name: X-GH-PARTNER-KEY
        in: header
        description: Partners grubhub provided UUID
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        example: 97f6eca-6276-4993-bfeb-53cbbbba6f08
      - name: custIds
        in: query
        description: Optional list of customer IDs to filter eligibility check
        required: false
        style: form
        explode: true
        schema:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
      - name: page
        in: query
        description: Optional 1-based page number. Supplying page or size enables paginated mode. Defaults to 1 when only size is given.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: size
        in: query
        description: Optional page size. Hard-capped at 100, defaults to 50 when only page is given.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 10
      responses:
        '400':
          description: Bad Request - page or size is not a valid number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantEligibilityResponse'
        '200':
          description: Successfully retrieved merchant eligibility status
          headers:
            X-Total-Count:
              description: Total number of merchants across all pages (paginated requests only)
              style: simple
              explode: false
              schema:
                type: integer
                format: int64
            X-Page-Size:
              description: Page size applied to this response (paginated requests only)
              style: simple
              explode: false
              schema:
                type: integer
            X-Total-Pages:
              description: Total number of pages (paginated requests only)
              style: simple
              explode: false
              schema:
                type: integer
            X-Page:
              description: Current page number, 1-based (paginated requests only)
              style: simple
              explode: false
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links with first, prev, next and last relations (paginated requests only). The next relation is absent on the last page.
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantEligibilityResponse'
              example:
              - cust_id: 12345
                name: Joe's Pizza Palace
                address:
                  street_address: 123 Main St
                  street_address2: Suite 100
                  locality: New York
                  region: NY
                  postal_code: '10001'
                pos_eligibility: true
                reasons: []
              - cust_id: 67890
                name: Maria's Tacos
                address:
                  street_address: 456 Oak Ave
                  locality: Los Angeles
                  region: CA
                  postal_code: '90210'
                pos_eligibility: false
                reasons:
                - Not eligible for POS integration.
              - cust_id: 24680
                name: Bob's Burgers
                address:
                  street_address: 789 Pine St
                  street_address2: Unit B
                  locality: Chicago
                  region: IL
                  postal_code: '60601'
                pos_eligibility: false
                reasons:
                - Missing required configuration.
                - Invalid menu format.
        '422':
          description: Unprocessable Entity - Merchant has too many or no merchants to process, or invalid pagination parameters (page < 1, size < 1, or size above the maximum)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantEligibilityResponse'
    servers:
    - url: https://api-third-party-gtm-pp.grubhub.com
      description: preprod
    - url: https://api-third-party-gtm.grubhub.com
      description: prod
