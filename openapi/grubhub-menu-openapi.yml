        modifier_lists:
          type: array
          description: A list of the modifier lists included with this menu in any modifier prompt.
          items:
            $ref: '#/components/schemas/ModifierList'
        modifiers:
          type: array
          description: A list of selectable options within a modifier prompt that changes a menu item. That change
            may include price and calorie variations, and may be affected by size selections. This list will include
            all possible modifiers, regardless of the prompts or menu items that they are associated with.
          items:
            $ref: '#/components/schemas/Modifier'
        size_prompts:
          type: array
          description: Information about item sizing, including display text and pricing.
          items:
            $ref: '#/components/schemas/SizePrompt'
        sizes:
          type: array
          description: The sizes for all items in this menu.
          items:
            $ref: '#/components/schemas/Size'
        availability_ranges:
          type: array
          description: A list of the times during which seasonal menu items can be available.
          items:
            $ref: '#/components/schemas/AvailabilityRange'
        availability_overrides:
          type: array
          description: A list of the times during which items, modifiers or menu sections are not available for
            ordering.
          items:
            $ref: '#/components/schemas/AvailabilityOverride'
      description: The normalized menu.
    PosNormalizedMenuMedia:
      type: object
      properties:
        source_url:
          type: string
          description: The URL where the image file can be downloaded.
      description: Information about media used in the PosNormalizedMenu format.
    Size:
      required:
      - external_id
      - name
      type: object
      properties:
        external_id:
          type: string
          description: A user-configured identifier for this object within the menu. External IDs must be unique
            across all menu entities of this type. Any size that shares this `external_id` will be overwritten.
        name:
          type: string
          description: The display name for this size, which will be given to the diner as an option to select.
        internal_name:
          type: string
          description: A name displayed on Grubhub menu management tools instead of the display name.
        metadata:
          type: string
          description: Metadata associated with the size.
        fulfillment_type_settings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NormalizedSizeFulfillmentTypeSettings'
          description: OrderServiceType-specific configurations for this size. All keys should be strings representing
            order-service types (valid options include "STANDARD_DELIVERY", "STANDARD_PICKUP", "CATERING_DELIVERY",
            and "GROUP_DELIVERY". All values should be of type NormalizedSizeFulfillmentTypeSettings.
      description: Size selections for prompts within menu items.
    SizePrompt:
      required:
      - external_id
      - name
      type: object
      properties:
        external_id:
          type: string
          description: A user-configured identifier for this object within the menu. External IDs must be unique
            across all menu entities of this type. Any size prompt that shares this `external_id` will be overwritten.
        name:
          type: string
          description: The display name for this size prompt, which in this case is the prompt given to the diner.
        internal_name:
          type: string
          description: A name displayed on Grubhub menu management tools instead of the display name.
        sized_prices:
          type: array
          description: Additional price information about size within a normalized menu. For use in Size Prompts
            for the item pricing model.
          items:
            $ref: '#/components/schemas/SizedPrice'
      description: Information about item sizing, including display text and pricing.
    SizedPrice:
      required:
      - price
      - size
      type: object
      properties:
        size:
          type: string
          description: The `external_id` reference to a PosNormalizedSize.
        price:
          type: number
          description: Price for the referenced size.
        calorie_content:
          type: string
          description: Number of calories for the size.
        display_name:
          type: string
          description: Optional. If present, overrides the name of the referenced size, for display to diners.
        fulfillment_type_settings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NormalizedSizedPriceFulfillmentTypeSettings'
          description: OrderServiceType-specific configurations for this SizedPrice. All keys should be strings
            representing order-service types (valid options include "STANDARD_DELIVERY", "STANDARD_PICKUP", "CATERING_DELIVERY",
            and "GROUP_DELIVERY". All values should be of type NormalizedSizedPriceFulfillmentTypeSettings.
      description: Additional price information about size within a normalized menu. For use in Size Prompts for
        the item pricing model.
    Tag:
      required:
      - group
      - name
      type: object
      properties:
        group:
          type: string
          description: Tag group. Currently, the only valid group is 'LEGACY'
        name:
          type: string
          description: Tag name or code.
          enum:
          - ADVANCED_ORDERING
          - ALCOHOL
          - DESSERT
          - DAIRY_FREE
          - DRINK
          - GLUTEN_FREE
          - KOSHER
          - LOW_FAT
          - NOT_FOR_BIKER
          - NUT_FREE
          - RAW_FOOD_WARNING
          - SPECIALTY
          - SPICY
          - SODIUM_WARNING
          - TAX_EXEMPT
          - VEGAN
          - VEGETARIAN
          - FIFTEEN_TWENTY_LBS
          - TWENTY_TWENTYFIVE_LBS
          - TWENTYFIVE_THIRTY_LBS
          - THIRTY_PLUS_LBS
          - TWO_TWOHALF_FT
          - TWOHALF_THREE_FT
          - THREE_PLUS_FT
      description: Tags for menu items are used to flag certain items for special delivery handling, regulatory
        treatment, and to denote an item is eligible for certain flags and icons on Grubhub diner properties.
    TaxCategory:
      type: object
      properties:
        code:
          type: string
          description: A valid Grubhub internal tax category code.
      description: Tax category.
    TaxRate:
      required:
      - external_id
      - name
      type: object
      properties:
        external_id:
          type: string
          description: The merchant-set ID for this tax rate, which can be used to link it in the `PosNormalizedMenu`.
        name:
          type: string
          description: The name of the tax rate shown in Grubhub menu management user interfaces.
        rate:
          type: number
          description: Decimal tax rate. Must be between 0 and 1. This object must have a value for either this
            field or the `flat` field.
          format: double
        flat:
          type: number
          description: The absolute amount of tax applied to orders from this merchant. This object must have a
            value for either this field or the `rate` field.
          format: double
      description: Information about a tax rate in a normalized menu format. Tax rate to be applied at order checkout,
        if the diner is not tax-exempt. The tax rate listed here applies only to the items and modifiers with which
        it is associated. All other menu items will use the merchant tax rate.
    PosBulkSupplementalTagStatus:
      type: object
      properties:
        job_id:
          type: string
          description: A value that identifies a bulk supplemental tag request.
          format: uuid
        processing_complete:
          type: boolean
          description: True if this job processing is done (successful or not), false otherwise.
        status:
          type: string
          description: Status of a menu entity supplemental tag operation.
          enum:
          - QUEUED
          - SUCCESSFUL
          - FAILED
          - ALREADY_SUBMITTED
        reason:
          type: string
          description: Additional details that pertain to the status of the operation.
        entity_ids:
          uniqueItems: true
          type: array
          description: A list of external IDs that were part of the associated request.
          items:
            type: string
            description: A list of external IDs that were part of the associated request.
        merchant_id:
          type: string
          description: This field can either be the Grubhub ID for the merchant, or if an external ID is provided,
            it represents the external ID of the merchant.
      description: Describes the state (completed or not) of a bulk supplemental tag operation request together
        with its state (successful or not).
    InvalidCodeAndEntityIds:
      required:
      - code
      - entity_ids
      type: object
      properties:
        code:
          type: string
          description: The invalid tax category code found in the menu.
        entity_ids:
          uniqueItems: true
          type: array
          description: Set of entity ids with the invalid code above.
          items:
            type: string
            description: Set of entity ids with the invalid code above.
        errror_message:
          type: string
          description: The error message includes more details.
      description: A tax category validation error found on supplied menu
    MediaValidationErrorDTO:
      type: object
      properties:
        media_validation_error_message:
          type: string
          description: The message including error details.
          example: 'Precondition Failed : User request invalid, could not upload media.'
        entity_id:
          type: string
          description: The entity id of the item with media validation error.
          example: '123452933468'
        external_id:
          type: string
          description: The external id of the item with media validation error.
          example: ededebf898ebd89ebd9e8bd9b3
        url:
          type: string
          description: The url of the invalid media.
          example: https://mediahost.example/bacon.jpg
        menu_item_name:
          type: string
          description: The name of the item with media validation error.
          example: Bacon
      description: A media validation error that occurred during ingestion.
    MenuMerchantStatus:
      required:
      - merchant_id
      - status
      type: object
      properties:
        merchant_id:
          type: string
          description: The partner resource ID of the merchant whose specific menu ingestion job this status applies
            to.
        status:
          type: string
          description: Represents the current state of the menu ingestion job.<ul><li>`REQUESTED` - The ingestion
            process has been received, but it has not begun processing. Replaces `QUEUED`, but that status is not
            deprecated.</li><li>`QUEUED` - Waiting to process.</li><li>`IN_PROGRESS` - Job is in progress, possibly
            in retry cycle.</li><li>`SUCCESS` - Menu successfully updated.</li><li>`PARTIAL_SUCCESS` - Some portion
            of the menu has updated successfully, but not all.</li><li>`FAILED` - Menu could not be updated.</li><li>`FAILED_MENU_DOWNLOAD`
            - Menu request payload/URL could not be downloaded.</li><li>`FAILED_VALIDATION` - Menu request payload/URL
            could not be validated.</li><li>`UNKNOWN` - The ingestion process is in an unknown state. Contact support.</li></ul>
          enum:
          - REQUESTED
          - QUEUED
          - IN_PROGRESS
          - SUCCESS
          - PARTIAL_SUCCESS
          - FAILED
          - FAILED_MENU_DOWNLOAD
          - FAILED_VALIDATION
          - UNKNOWN
        menu_proof_url:
          type: string
          description: The proof URL to view the ingested menu on the front-end. This is only returned when the
            menu ingestion is successful.
        details:
          type: array
          description: 'A list where each element is a human-readable description of the status of this job or the
            problem encountered, if any. For example: ["Control details: jobId is ...", "Other details"], ["Error
            message"] '
          items:
            type: string
            description: 'A list where each element is a human-readable description of the status of this job or
              the problem encountered, if any. For example: ["Control details: jobId is ...", "Other details"],
              ["Error message"] '
        media_processing_status:
          type: string
          description: Status reflecting the state of the media uploads.
        media_validation_error_list:
          type: array
          description: A List of any media validation errors that occurred during ingestion.
          items:
            $ref: '#/components/schemas/MediaValidationErrorDTO'
        tax_category_validation_errors:
          type: array
          description: List of tax category validation errors on supplied menu.
          items:
            $ref: '#/components/schemas/InvalidCodeAndEntityIds'
        weighted_items_validation_errors:
          type: string
          description: String of comma-delimited items that were marked as invalid weighted items. Will not be ingested.
      description: The current state or result of a menu ingestion job. Each status will be communicated with both
        a standardized status string and a human-readable description.
    PosNormalizedMenuUpdateStatus:
      required:
      - details
      - job_id
      - merchant_statuses
      type: object
      properties:
        job_id:
          type: string
          description: The identifier of the job that the status messages come from.
        details:
          type: string
          description: Details associated with the update status.
        merchant_statuses:
          type: array
          description: The current state or result of a menu ingestion job.
          items:
            $ref: '#/components/schemas/MenuMerchantStatus'
      description: The current status of a menu ingestion job.
