  /pos/v1/merchant/{merchant_id}/menu/entities/tags/{job_id}/status:
    get:
      tags:
      - Endpoints
      summary: Check supplemental tag job status
      description: Checks the status of the specified supplemental tag job.
      operationId: getBulkSupplementalTagStatus
      parameters:
      - name: merchant_id
        in: path
        description: The short Grubhub ID for the merchant. Corresponds to a single location.
        required: true
        explode: false
        schema:
          type: string
      - name: job_id
        in: path
        description: The unique supplemental tag job identifier.
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job status was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosBulkSupplementalTagStatus'
        '404':
          description: Job does not exist.
  /pos/v1/menu/ingestion/jobs/{job_id}:
    get:
      tags:
      - Endpoints
      summary: Check ingestion job status
      description: Checks the status of the specified menu ingestion job.
      operationId: getMenuIngestionStatus
      parameters:
      - name: X-GH-PARTNER-KEY
        in: header
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        description: The identifier of the menu ingestion job to check.
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosNormalizedMenuUpdateStatus'
              example:
                job_id: 35b5b71c-417c-448f-8390-5eea50b59ca5
                details: Successful ingestion
                merchant_statuses:
                - merchant_id: '12035446'
                  status: SUCCESS
                  menu_proof_url: https://pp.grubhub.com/restaurant/12035446?proof=true
        '404':
          description: No job found for that ID
components:
  schemas:
    RepeatingSchedule:
      required:
      - external_id
      - name
      - rules
      type: object
      properties:
        external_id:
          type: string
          description: The merchant-set ID for this schedule, which can be used to link it in the `PosNormalizedMenu`.
        name:
          type: string
          description: The display name for this schedule, e.g. "Sunday Brunch"
        type:
          type: string
          description: How often this schedule repeats. Currently the only valid value is "WEEKLY".
          enum:
          - WEEKLY
        rules:
          type: array
          description: A set of non-overlapping time periods.
          items:
            $ref: '#/components/schemas/RepeatingScheduleRule'
      description: Information about a weekly schedule during which a menu item may be made available. Typical usages
        include Breakfast, Lunch, Dinner, Weekend Brunch, etc.
    RepeatingScheduleRule:
      required:
      - end_time
      - start_time
      type: object
      properties:
        days:
          uniqueItems: true
          type: array
          description: Days of the week for which the time period applies. Must be one of [MONDAY, TUESDAY, WEDNESDAY,
            THURSDAY, FRIDAY, SATURDAY, SUNDAY]
          items:
            type: string
            description: Days of the week for which the time period applies. Must be one of [MONDAY, TUESDAY, WEDNESDAY,
              THURSDAY, FRIDAY, SATURDAY, SUNDAY]
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        start_time:
          type: string
          description: The time when this schedule begins on the days listed, in the merchant's local time. Must
            conform to ISO date and time format
          example: '09:30:00.000'
        end_time:
          type: string
          description: The time when this schedule ends on the days listed, in the merchant's local time. Must conform
            to ISO date and time format
          example: '22:30:00.000'
      description: A time period and repetition rule.
    PosNormalizedMenuValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: Indicates whether the input menu is valid for ingestion.
        validation_errors:
          type: array
          description: If the validation fails, this field contains a description of the problem.
          items:
            type: string
            description: If the validation fails, this field contains a description of the problem.
      description: The results from a normalized menu validation. If successful, the valid property will be true.
        If the validation fails, the valid property will be false and the validation_errors property will indicate
        which menu field caused the failure and why.
    PosNormalizedMenuUpdateRequest:
      required:
      - menu_url
      - merchant_ids
      type: object
      properties:
        merchant_ids:
          type: array
          description: An array containing only a single merchant ID for applying an uploaded menu to a specific
            location.
          items:
            type: string
            description: An array containing only a single merchant ID for applying an uploaded menu to a specific
              location.
        menu_url:
          type: string
          description: The location or webhook where the Grubhub API can download a PosNormalizedMenu object, either
            as a gzip file or uncompressed.
        normalized_menu:
          type: boolean
          description: Indicated whether this endpoint expects the normalized menu object structured as a series
            of object types linked by references (`true`). Make sure to use `true` for normalized menu.
        apply_existing_schedule_overrides:
          type: boolean
          description: Should the schedule overrides that are currently in the Grubhub system be applied to this
            menu.
      description: A normalized menu update request.
    PosNormalizedMenuUpdateResult:
      required:
      - job_id
      type: object
      properties:
        job_id:
          type: string
          description: An identifier that you can use to check the status of this update job.
      description: The response payload from a normalized menu ingestion.
    PosScheduleOverrideBaseRequest:
      required:
      - end
      - op
      - show_or_hide
      - start
      type: object
      properties:
        op:
          type: string
          description: The operation to perform [ADD, UPDATE].
          enum:
          - ADD
          - UPDATE
        cur_end_date:
          type: string
          description: 'ISO-8601 format.For ADD operations, the current end date is not required.For UPDATE operations,
            the current end date is required. '
          format: date-time
        start:
          type: string
          description: ISO-8601 format. The beginning of the temporary override period.
          format: date-time
        end:
          type: string
          description: ISO-8601 format. The end of the temporary override period. A sentinel value of "9999-12-31T23:59:00.000Z"
            is used to "archive" an item.
          format: date-time
        show_or_hide:
          type: string
          description: The options to use for the override.
          enum:
          - SHOW
          - HIDE
      description: A schedule override operation to be performed for multiple entities of any type (ITEM or MODIFIER).
    PosScheduleOverrideBulkRequest:
      required:
      - entity_ids
      - schedule_override
      type: object
      properties:
        entity_ids:
          type: array
          description: A list of entity IDs to apply the schedule override operation for. The entities can have
            any type (ITEM or MODIFIER), and the IDs can be either Grubhub internal IDs or Partner external IDs.
            If one of the IDs if not valid, the other IDs won't be processed either, and the operation will be aborted.
          items:
            type: string
            description: A list of entity IDs to apply the schedule override operation for. The entities can have
              any type (ITEM or MODIFIER), and the IDs can be either Grubhub internal IDs or Partner external IDs.
              If one of the IDs if not valid, the other IDs won't be processed either, and the operation will be
              aborted.
        schedule_override:
          $ref: '#/components/schemas/PosScheduleOverrideBaseRequest'
      description: A schedule override operation to be performed for multiple entities of any type (ITEM or MODIFIER).
    ScheduleOverride:
      required:
      - end
      - show_or_hide
      - start
      type: object
      properties:
        start:
          type: string
          description: ISO-8601 format. The beginning of the temporary override period.
          format: date-time
        end:
          type: string
          description: ISO-8601 format. The end of the temporary override period. A sentinel value of "9999-12-31T23:59:00.000Z"
            is used to "archive" an item.
          format: date-time
        show_or_hide:
          type: string
          description: The options to use for the override.
          enum:
          - SHOW
          - HIDE
      description: The schedule override details.
    PosScheduleOverrideMultiOperationResult:
      type: object
      properties:
        entity_ids:
          type: array
          description: Array of either menu entity internal (Grubhub) OR external (Partner) IDs. This list will
            contain all the entity IDs sent in the associated request.
          items:
            type: string
            description: Array of either menu entity internal (Grubhub) OR external (Partner) IDs. This list will
              contain all the entity IDs sent in the associated request.
        job_id:
          type: string
          description: A unique reference used to identify the status of this operation.
          format: uuid
        status:
          type: string
          description: Status of a menu entity schedule override operation.
          enum:
          - QUEUED
          - OK
          - INVALID
          - ERROR
        message:
          type: string
          description: Text description providing more detail on the status.
      description: Result of a bulk schedule override add/update request.
    TagProductsRequest:
      required:
      - external_ids
      type: object
      properties:
        external_ids:
          uniqueItems: true
          type: array
          description: A list of external IDs to which to apply the tag(s)
          items:
            type: string
            description: A list of external IDs to which to apply the tag(s)
      description: Operation to tag a specified list of item/modifier IDs.
    PosSupplementalTagMultiOperationResult:
      type: object
      properties:
        entity_ids:
          uniqueItems: true
          type: array
          description: Array of menu entity external (Partner) IDs. This list will contain all the entity IDs sent
            in the associated request.
          items:
            type: string
            description: Array of menu entity external (Partner) IDs. This list will contain all the entity IDs
              sent in the associated request.
        job_id:
          type: string
          description: A unique reference used to identify the status of this operation.
          format: uuid
        status:
          type: string
          description: Status of a menu entity supplemental tag operation.
          enum:
          - QUEUED
          - SUCCESSFUL
          - FAILED
          - ALREADY_SUBMITTED
        message:
          type: string
          description: Text description providing more detail on the status.
      description: Result of a bulk supplemental tag update request.
    BulkProcessingItemEntityStatus:
      type: object
      properties:
        entity_index:
          type: integer
          description: The index of the entity in the original list of IDs as it was sent to Grubhub.
          format: int32
        entity_id:
          type: string
          description: Either the menu entity internal (Grubhub) OR external (Partner) IDs.
        status:
          type: string
          description: Status of the override operation for this entity.
        details:
          type: string
          description: Additional details that pertain to the the individual entity's status.
      description: An individual override entity and its status.
    PosBulkScheduleOverrideStatus:
      type: object
      properties:
        job_id:
          type: string
          description: A value that identifies a bulk schedule override request.
          format: uuid
        processing_complete:
          type: boolean
          description: True if this job processing is done (successful or not), false otherwise.
        status:
          type: string
          description: The final status of the operation - SUCCESSFUL / FAILED.
        reason:
          type: string
          description: Additional details that pertain to the status of the override.
        entity_override_results:
          type: array
          description: A list of each entity and its individual override status (specific configurations are required
            to enable this).
          items:
            $ref: '#/components/schemas/BulkProcessingItemEntityStatus'
        merchant_id:
          type: string
          description: This field can either be the Grubhub ID for the merchant, or if an external ID is provided,
            it represents the external ID of the merchant.
      description: Describes the state (completed or not) of a bulk schedule override operation request together
        with its state (successful or not).
    PosItemScheduleOverrides:
      required:
      - intervals
      - item_id
      - merchant_id
      type: object
      properties:
        merchant_id:
          type: string
          description: The Grubhub or third-party provided external ID for the merchant. Corresponds to a single
            location.
        item_id:
          type: string
          description: The ID of the item.
        external_id:
          type: string
          description: The external ID of the item.
        intervals:
          type: array
          description: The list of schedule override details.
          items:
            $ref: '#/components/schemas/ScheduleOverride'
      description: Item override.
    PosModifierScheduleOverrides:
      required:
      - intervals
      - merchant_id
      - modifier_id
      type: object
      properties:
        merchant_id:
          type: string
          description: The Grubhub or third-party provided external ID for the merchant. Corresponds to a single
            location.
        modifier_id:
          type: string
          description: The ID of the modifier.
        external_id:
          type: string
          description: The external ID of the item.
        intervals:
          type: array
          description: The list of schedule override details.
          items:
            $ref: '#/components/schemas/ScheduleOverride'
      description: Modifier override
    PosScheduleOverrides:
      required:
      - item_overrides
      - merchant_id
      - modifier_overrides
      type: object
      properties:
        merchant_id:
          type: string
          description: The Grubhub or third-party provided external ID for the merchant. Corresponds to a single
            location.
        item_overrides:
          type: array
          description: The list of item overrides.
          items:
            $ref: '#/components/schemas/PosItemScheduleOverrides'
        modifier_overrides:
          type: array
          description: The list of modifier overrides.
          items:
            $ref: '#/components/schemas/PosModifierScheduleOverrides'
      description: A list of override schedules for items and modifiers
    AvailabilityOverride:
      required:
      - end_date
      - external_id
      - name
      - override_type
      - start_date
      type: object
      properties:
        external_id:
          type: string
          description: A user-configured identifier for this object within the menu. External IDs must be unique
            across all menu entities of this type. Any availability override that shares this `external_id` will
            be overwritten.
        name:
          type: string
          description: The display name for this availability override, which will be shown internally and externally.
        start_date:
          type: string
          description: The date and time when this override begins.
          format: date-time
        end_date:
          type: string
          description: The date and time when this override ends.
          format: date-time
        override_type:
          type: string
          description: The type of availability override, [AVAILABLE, UNAVAILABLE].
          enum:
          - AVAILABLE
          - UNAVAILABLE
      description: Definitions of time range during which item or modifier is not available.
    AvailabilityRange:
      required:
      - external_id
      - name
      - start_date
      type: object
      properties:
        external_id:
          type: string
          description: A user-configured identifier for this object within the menu. External IDs must be unique
            across all menu entities of this type. Any availability range that shares this `external_id` will be
            overwritten.
        name:
          type: string
          description: The display name for this availability, which will be shown internally and externally.
        start_date:
          type: string
          description: The date and time when this override begins.
          format: date-time
        end_date:
          type: string
